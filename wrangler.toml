name = "wreck-hunt"
main = "src/worker.js"
compatibility_date = "2026-05-01"
routes = [{ pattern = "wreckhunt.techguyverlabs.org", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/f/*", "/c/*"]
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
